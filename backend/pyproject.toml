[project]
name = "visionkit-backend"
version = "0.1.0"
description = "VisionKit backend for local computer vision pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
