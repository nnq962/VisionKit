[project]
name = "visionkit-ai"
version = "0.1.0"
description = "VisionKit internal AI service for model metadata and inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "onnx>=1.23.2",
    "onnxruntime<1.24",
    "numpy>=1.26.4",
    "opencv-python>=4.11",
    "pillow>=11",
    "pillow-heif>=1.8.1",
    "torch>=2.6",
    "ultralytics>=8.4.150",
    "uvicorn>=0.54.0",
    "clip",
]

[project.optional-dependencies]
youtube = ["yt-dlp>=2026.6.9"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git", rev = "7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40" }
